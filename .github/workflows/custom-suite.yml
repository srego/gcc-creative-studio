name: Custom Extension Quality Suite

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
      - develop
      - test
    paths:
      - 'backend/src/custom/**'
      - 'backend/tests/custom/**'
      - 'frontend/src/app/custom/**'
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/src/custom/**'
      - 'backend/tests/custom/**'
      - 'frontend/src/app/custom/**'
  workflow_dispatch:

jobs:
  custom-backend-test:
    name: Custom Backend Suite (Coverage >= 80%)
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: 'dummy-project-id'
      ENVIRONMENT: 'test'
      isLocal: 'True'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Install dependencies
        run: |
          cd backend
          uv sync --all-extras

      - name: Format Check (Black)
        run: |
          cd backend
          uv run black --check src/custom tests/custom

      - name: Run Custom Unit Tests & Coverage
        run: |
          cd backend
          uv run pytest tests/custom -v --cov=src/custom --cov-fail-under=80

  custom-frontend-test:
    name: Custom Frontend Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Compile Check
        run: |
          cd frontend
          npm run compile

      - name: Run GTS Lint
        run: |
          cd frontend
          npx gts lint
